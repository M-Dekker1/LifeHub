<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeHub</title>
<meta name="theme-color" content="#5b4bf0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LifeHub">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Barlow:wght@400;500;600&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fa;--side:#fff;--card:#fff;--ink:#121528;--mute:#5e6584;--line:#e1e4f0;--acc:#5b4bf0;--acc2:#f2541b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c16;--side:#0f1220;--card:#151929;--ink:#eef0fa;--mute:#8c93b0;--line:#232842;--acc:#7b6cff;--acc2:#ff6a3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c16;--side:#0f1220;--card:#151929;--ink:#eef0fa;--mute:#8c93b0;--line:#232842;--acc:#7b6cff;--acc2:#ff6a3d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.big,.nm{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:700;margin:0}
h1{font-size:clamp(36px,5vw,52px);line-height:1}
h2{font-size:26px;margin:20px 0 10px}
h3{font-size:21px;margin:0 0 10px}
.app{display:flex;min-height:100vh}
aside{width:272px;flex:0 0 272px;background:var(--side);border-right:1px solid var(--line);padding:24px 16px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.land aside{display:none}
.prof{text-align:center}
.av{width:104px;height:104px;border-radius:50%;border:0;padding:4px;cursor:pointer;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));display:block;margin:0 auto 12px}
.av>*{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);font:italic 700 34px "Barlow Condensed",sans-serif}
.nm{font-size:26px}
.ct{color:var(--mute);font-size:15px}
.st{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;border:1px solid var(--line);border-radius:12px}
.st div{padding:10px 4px;text-align:center}
.st div+div{border-left:1px solid var(--line)}
.st b{display:block;font:italic 700 21px "Barlow Condensed",sans-serif}
.st span{color:var(--mute);font-size:13px}
.links{display:flex;flex-direction:column;gap:4px;flex:1}
.links button{text-align:left;border:0;background:none;color:var(--mute);font:500 16px Barlow,sans-serif;padding:11px 14px;border-radius:10px;cursor:pointer}
.links button:hover{background:var(--bg);color:var(--ink)}
.links button[aria-current="true"]{background:linear-gradient(100deg,var(--acc),var(--acc2));color:var(--on);font-weight:600}
.hub{margin-top:16px;border:0;border-radius:14px;padding:20px 12px;font:italic 700 24px "Barlow Condensed",sans-serif;color:var(--on);background:linear-gradient(100deg,var(--acc),var(--acc2));cursor:pointer}
main{flex:1;min-width:0;padding:24px clamp(16px,3vw,36px) 40px;max-width:1180px}
.top{display:none}
.sub{color:var(--mute);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.lab{color:var(--mute);font-size:14px;margin-bottom:4px}
.big{font-size:40px;line-height:1}
.big small{font:500 15px Barlow,sans-serif;font-style:normal;color:var(--mute);margin-left:5px}
.hint{color:var(--acc2);font-size:13px;margin-top:4px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px;align-items:end}
label{display:flex;flex-direction:column;justify-content:flex-end;font-size:14px;color:var(--mute);gap:4px}
input,select{font:16px Barlow,sans-serif;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.hs:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.add{align-self:end;background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:12px;font:600 16px Barlow,sans-serif;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font:500 15px Barlow,sans-serif;cursor:pointer}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:20px}
svg.sp{width:100%;height:64px;color:var(--acc);display:block;margin-top:8px}
.empty{color:var(--mute);padding:8px 0}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
.sec{margin-bottom:18px}
.pick{display:block;width:100%;max-width:420px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:18px;border-top:5px solid var(--acc2)}
.pick h2{margin:0 0 6px;font-size:40px}
.two{display:grid;grid-template-columns:minmax(200px,330px) 1fr;gap:18px;align-items:start;margin-top:14px}
.fig{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;text-align:center}
.fig svg{height:min(calc(100vh - 150px),640px);max-width:100%;width:auto}
.body-s{fill:var(--line);fill-opacity:.7;stroke:var(--acc);stroke-width:2.5}
.hs{cursor:pointer}
.hs line{stroke:var(--acc2);stroke-width:3;stroke-dasharray:5 3;stroke-linecap:round}
.hs:hover line,.hs:focus line{stroke-width:6}
.hs rect{fill:transparent}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.g3 .big{font-size:32px}
.mf{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
.tip{position:fixed;z-index:50;width:210px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.tip[hidden]{display:none}
.tip svg.sp{height:44px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{position:relative;aspect-ratio:3/4;border:0;border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;color:#fff;padding:0;display:block;width:100%}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(5,8,20,.78))}
.tile h3{font-size:26px;margin:8px 0 0;line-height:1}
.pill{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:2px 10px;font-size:12.5px;margin:0 4px 0 0;font-style:normal;font-family:Barlow,sans-serif;font-weight:500}
.newt{background:none;border:2px dashed var(--line);color:var(--mute);display:flex;align-items:center;justify-content:center;font:italic 700 26px "Barlow Condensed",sans-serif}
.pillr .pill{background:var(--card);border-color:var(--line);color:var(--ink)}
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--mute);font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:12px 0}
.row label{flex:1;min-width:150px}
.desc p{margin:0 0 8px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:900px){.two{grid-template-columns:1fr}.fig svg{height:min(70vh,560px)}}
@media (max-width:820px){
.app{display:block}
aside{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;height:auto;transform:translateX(-105%);transition:transform .2s;width:min(300px,86vw)}
.open aside{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--side);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.top button{background:none;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:20px;padding:6px 12px;cursor:pointer}
.top b{font:italic 700 24px "Barlow Condensed",sans-serif}
.land .top{display:none}
.g3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
.fig{position:relative}
.vt{position:absolute;top:10px;right:10px;z-index:2}
.mform{display:block}
.mform>*{margin-bottom:12px}
.grp{border:1px solid var(--line);border-radius:12px;padding:12px}
.grp h3{font-size:18px;margin-bottom:8px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.lg{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center}
.lg b{font-weight:500;color:var(--mute);font-size:14px}
.mlg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ie{display:flex;gap:4px;align-items:center}
.card[data-tip]{cursor:help}
.seg{position:relative;display:flex;gap:2px;height:8px;margin:20px 0 4px}
.seg i{flex:1;border-radius:3px;background:var(--acc)}
.seg i:nth-child(1){opacity:.25}.seg i:nth-child(2){opacity:.5}.seg i:nth-child(3){opacity:.75}
.arw{position:absolute;top:-16px;transform:translateX(-50%);color:var(--acc2);font-size:12px;line-height:1}
.segl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.tip p{margin:6px 0}
.badge{display:inline-block;background:var(--acc2);color:#fff;border-radius:99px;padding:1px 10px;font:600 13px Barlow,sans-serif;font-style:normal;vertical-align:middle}
.tb{position:absolute;top:12px;left:12px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mute);overflow:hidden}
.wk div.on{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.wk b{display:block;font-size:13px}
.srow{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:10px}
.srow b{grid-column:1/-1}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:18px 8px;font:italic 700 22px "Barlow Condensed",sans-serif;cursor:pointer}
.opt[aria-pressed="true"]{background:linear-gradient(100deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
input[type=range]{padding:0;accent-color:var(--acc)}
#nd{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.dt{font:italic 700 22px "Barlow Condensed",sans-serif}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;align-items:end;border-top:1px solid var(--line);padding-top:10px;margin-bottom:8px}
.frow:first-child{border-top:0;padding-top:0}
.wk div.on,.opt[aria-pressed="true"]{background-origin:border-box;background-clip:border-box;border-color:transparent}
.links button{display:flex;align-items:center;gap:10px}
.links svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fl{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.dnav{position:relative;display:grid;grid-template-columns:52px 1fr 52px;gap:8px;width:min(100%,500px)}
.dnav .dt{width:100%;text-align:center}
.cal{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:292px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cal .dh{margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg button{border:0;background:none;color:var(--ink);padding:8px 0;border-radius:8px;cursor:pointer;font:inherit}
.cg button:hover{background:var(--bg)}
.cg button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.cg .td{outline:1px solid var(--acc2)}
.cg i{color:var(--mute);font-size:12px;font-style:normal;padding:4px 0}
.exf .m-w,.exf .m-b,.exf .m-t{display:none}
.exf[data-mode="w"] .m-w,.exf[data-mode="b"] .m-b,.exf[data-mode="t"] .m-t{display:flex}
.exf[data-mode="t"] .m-r{display:none}
.exr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:grab;border-radius:8px}
.exr.over{outline:2px dashed var(--acc)}
.grip{color:var(--mute);letter-spacing:-3px;font-size:18px}
.exi{flex:1;display:flex;flex-direction:column}
.exi span{color:var(--mute);font-size:14px}
.sx{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.sxt{display:block;margin-bottom:8px}
.srow2{display:grid;grid-template-columns:auto repeat(auto-fit,minmax(90px,1fr)) auto;gap:8px;align-items:end;margin-bottom:8px}
.srow2>b{align-self:center;min-width:44px}
.band{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sw{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex:none}
.band input[type=color]{width:46px;padding:2px;height:40px}
.est{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:14px;align-items:center}
.est .fig svg{height:300px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{margin:0}
.ph img,.noph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
.noph{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--mute);border:1px dashed var(--line)}
.ph figcaption{font-size:12.5px;color:var(--mute);margin-top:4px}
@media (max-width:600px){.cmp3{grid-template-columns:1fr}.est{grid-template-columns:1fr}}
.pill{margin:0 4px 6px 0}
.dgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
.dbx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-width:0}
.dbx:hover{border-color:var(--acc)}
.dbx:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dbx .big{font-size:42px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.hero{flex-direction:row;align-items:center;gap:18px}
.ring{width:130px;height:130px;flex:none}
.hl{font:italic 700 clamp(32px,5vw,52px)/1 "Barlow Condensed",sans-serif}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips span{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.mrow{display:flex;gap:28px;flex-wrap:wrap}
.dk{font-size:13.5px;color:var(--mute)}
.ev{display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ev b{font-weight:500;color:var(--mute);min-width:90px}
.ev span{flex:1}
@media (max-width:900px){.dgrid{grid-template-columns:repeat(2,1fr)}.s3,.s4,.s6{grid-column:1/-1}.hero{flex-direction:column;text-align:center}}
pre.sql{white-space:pre-wrap;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0}
details summary{cursor:pointer;color:var(--acc)}
.uscroll{max-height:340px;overflow:auto}
.uscroll th{position:sticky;top:0;background:var(--card);z-index:1}
.uscroll input{width:96px;padding:6px}
.uscroll input[type=date]{width:150px}
.nw{white-space:nowrap}
.sets{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.srow2{display:flex;flex-direction:column;gap:6px;flex:1 1 128px;max-width:170px;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative;margin:0}
.srow2>b{align-self:flex-start;min-width:0}
.srow2>.x{position:absolute;top:2px;right:4px;padding:2px 6px}
.srow2 label{font-size:13px}
.srow2 input,.srow2 select{padding:7px}
.opts2{border:0;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.opts2 legend{padding:0 0 6px}
label.chk{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--ink);cursor:pointer;font-size:15px}
label.chk input{width:auto;margin:0}
label.chk:has(input:checked){background:var(--acc);color:var(--on);border-color:var(--acc)}
.exf .m-r{display:none}
.exf[data-o~="r"] .m-r,.exf[data-o~="w"] .m-w,.exf[data-o~="b"] .m-b,.exf[data-o~="t"] .m-t{display:flex}
.wt{grid-row:span 2}
.wfig svg{height:250px;width:auto;max-width:100%;display:block;margin:0 auto}
.jd{margin-top:10px;padding:10px 14px;border-left:4px solid var(--mute);border-radius:8px;background:var(--bg)}
.jd.good{border-color:#22c55e}.jd.ok{border-color:#eab308}.jd.improve{border-color:#f97316}.jd.bad{border-color:#ef4444}
.stc{cursor:pointer;border-radius:10px}
.stc:hover{background:var(--bg)}
.ch polyline,.ch line{pointer-events:none}
.ch .hit:hover{fill:var(--acc);fill-opacity:.25}
@media (max-width:900px){.wt{grid-row:auto}}
.qp{display:inline-block;align-self:flex-start;color:#fff;font:600 13px Barlow,sans-serif;font-style:normal;padding:3px 12px;border-radius:99px}
.dl{display:flex;align-items:center;gap:8px}

.ver{margin-top:8px;font-size:12px;color:var(--mute)}
@keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pg{animation:pgin .22s ease-out}
@media (prefers-reduced-motion:reduce){.pg{animation:none}}

.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 14px;font:500 14px Barlow,sans-serif;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.il{margin:6px 0 0;padding-left:20px}

.etot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin:-4px 0 8px;color:var(--mute);font-size:14px}

tr.tt td{border-top:2px solid var(--line);border-bottom:0}

.trophy{font-size:34px;display:inline-block;animation:trwig .9s ease-out}

var MD={
rhr:["Resting heart rate is the number of times your heart beats per minute while you are completely at rest, such as first thing in the morning before getting up.","It reflects how efficiently your heart pumps and how well you are recovering. A lower number generally means a stronger, fitter heart, while a rise of several beats above your normal can point to stress, poor sleep, illness or overtraining.","For a healthy adult, roughly 50 to 70 bpm is a good target, and well-trained athletes are often in the 40s to 50s. Anything consistently above 100 bpm is worth discussing with a doctor."],
hrv:["Heart rate variability (HRV) measures the small variation in time between each heartbeat, usually reported in milliseconds.","It is a window into your autonomic nervous system. A higher HRV generally means your body is relaxed, recovered and adaptable, while a low or falling HRV suggests stress, fatigue, illness or too much training.","HRV is highly individual and declines with age, so the best benchmark is your own baseline. Many healthy adults sit between about 40 and 100 ms, and the goal is a stable or gently rising trend."],
weight:["Weight is your total body mass, including muscle, fat, bone, organs and water.","On its own it says little about health, but its trend shows whether you are in an energy surplus or deficit. It can swing a kilo or two daily with water and food, so weekly averages matter more than single readings.","The optimal weight for a healthy person is the one that keeps BMI and body fat in healthy ranges for your height and build. When building muscle, a slow rise of around 0.25 to 0.5 kg a week is typical."],
bmi:["Body mass index (BMI) is your weight in kilograms divided by your height in metres squared.","It is a quick screening tool for whether your weight is proportionate to your height. It cannot tell muscle from fat, so muscular people can score as overweight despite being lean.","A BMI of 18.5 to 24.9 is considered healthy for most adults. Treat it as one signal alongside waist size and body fat rather than a verdict."],
bf:["Body fat percentage is the portion of your total body weight made up of fat.","It describes your composition far better than scale weight. Some fat is essential for hormones and organs, but too much, especially around the abdomen, raises the risk of heart disease and diabetes.","For healthy men, roughly 10 to 20 percent is optimal, and for women roughly 18 to 28 percent. Athletes may sit lower, but staying very lean for long periods is not advisable."],
lean:["Lean body mass is everything in your body that is not fat: muscle, bone, organs and water.","It tracks the muscle you are building or losing. Rising lean mass alongside stable or falling fat is the clearest sign your training and nutrition are working, while falling lean mass during a diet suggests muscle loss.","There is no single ideal number because it depends on height and frame. A healthy person aims to keep it stable through life, and someone training for strength aims to grow it steadily."],
waist:["Waist circumference is the distance around your midsection, measured at the narrowest point or at navel level.","It estimates abdominal fat, which surrounds the organs and is more strongly linked to heart disease, diabetes and inflammation than fat stored elsewhere.","Under 94 cm for men and under 80 cm for women is optimal for health. Keeping your waist under half your height is another simple, useful target."],
rest:["Resting energy, or basal metabolic rate, is the calories your body burns each day just to stay alive, powering breathing, circulation and cell repair.","It makes up most of your daily energy use and is the foundation for working out how much to eat. It rises with more muscle and body size and falls with age. Here it is estimated with the Mifflin-St Jeor equation from your sex, age, height and weight.","Healthy adults typically sit between about 1,300 and 2,000 kcal a day. Treat the figure as an estimate, not a measurement."],
active:["Active energy is the calories you burn through movement on top of your resting energy, including workouts, walking and daily activity.","It shows how much you actually move. It varies widely day to day and is the part of your energy budget you control most directly.","For a healthy adult, about 300 to 800 kcal of active energy a day is a good range, which usually matches 150 or more minutes of moderate exercise per week plus regular walking."],
tdee:["Total daily energy expenditure (TDEE) is your resting energy plus your active energy, the total calories you burn in a day.","It is the break-even point for your weight. Eating above it leads to weight gain and eating below it leads to loss, so it anchors your nutrition and goal planning.","Healthy adults typically fall between about 1,800 and 3,000 kcal. The optimal intake is close to your TDEE for maintenance, a modest surplus for building muscle or a moderate deficit for fat loss."],
vo2:["Cardio fitness, measured as VO2 max, is the maximum amount of oxygen your body can use during intense exercise, in millilitres per kilogram per minute.","It is one of the strongest predictors of long-term health and longevity, reflecting how well your heart, lungs and muscles work together.","For healthy adults aged 20 to 40, around 40 to 50 or higher for men and 35 to 45 or higher for women is good, and values decline with age. Being above average for your age and sex is an excellent goal."],
hrr:["Cardio recovery is how many beats per minute your heart rate falls in the first minute after you stop intense exercise.","A quick drop shows a fit heart and a well-balanced nervous system that can switch from effort to rest efficiently. A slow drop is associated with lower fitness and higher cardiovascular risk.","A drop of 20 or more bpm after one minute is healthy, and well-trained people often see 30 to 50 bpm."],
sleep:["Sleep length is the total time you spend asleep each night.","Sleep is when your body repairs tissue, builds muscle, consolidates memory and regulates hormones that control appetite and stress. Short sleep hurts recovery, mood, performance and long-term health.","Most healthy adults do best with seven to nine hours a night, and athletes in hard training often benefit from the upper end of that range."]};

function lsw(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{SY.ts=+lsr('lifehub-ts')||0;SBC=JSON.parse(lsr('lifehub-sb')||'null')||SBC;SBS=JSON.parse(lsr('lifehub-sbs')||'null')}catch(e){}
var SQL=['create table if not exists public.lifehub_data (','  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,','  k text not null,','  v text not null,','  ts bigint not null default 0,','  primary key (user_id, k)',');','alter table public.lifehub_data enable row level security;','create policy "own select" on public.lifehub_data for select using (auth.uid() = user_id);','create policy "own insert" on public.lifehub_data for insert with check (auth.uid() = user_id);','create policy "own update" on public.lifehub_data for update using (auth.uid() = user_id) with check (auth.uid() = user_id);','create policy "own delete" on public.lifehub_data for delete using (auth.uid() = user_id);'].join('\n');
function hasData(){return!!(S.food.length||S.sess.length||S.prog.length||(S.body||[]).length||(S.sleep||[]).length||(S.vitals||[]).length||Object.keys(S.m).length||P.name||S.pics.length)}
function ensure(){['profile','goals','m','ns'].forEach(function(k){S[k]=S[k]||{}});['sess','food','pics','bands','prg','prog'].forEach(function(k){S[k]=S[k]||[]});P=S.profile;G=S.goals}
function packS(){var imgs={},c=JSON.parse(JSON.stringify(S));
if(c.profile.pic){imgs.pic=c.profile.pic;c.profile.pic='@img:pic'}
c.prog.forEach(function(p){if(p.img){imgs['pg'+p.id]=p.img;p.img='@img:pg'+p.id}});
c.pics.forEach(function(x){['front','side','rear'].forEach(function(a){if(x[a]){imgs['ph'+x.id+a]=x[a];x[a]='@img:ph'+x.id+a}})});
return{json:JSON.stringify(c),imgs:imgs}}
function sbu(){return SBC.url.replace(/\/+$/,'')}
function sbSession(j){SBS={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:(j.user&&j.user.id)||(SBS&&SBS.uid),email:(j.user&&j.user.email)||(SBS&&SBS.email)};lsw('lifehub-sbs',JSON.stringify(SBS))}
async function sbRefresh(){var r=await fetch(sbu()+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SBC.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SBS.rt})});if(!r.ok){SBS=null;lsw('lifehub-sbs','');throw new Error('Your session expired. Please sign in again.')}sbSession(await r.json())}
async function sbf(path,o,again){o=o||{};if(SBS&&SBS.exp-Date.now()<60000&&SBS.rt)await sbRefresh();
var h=Object.assign({apikey:SBC.key,'Content-Type':'application/json'},o.headers||{});if(SBS)h.Authorization='Bearer '+SBS.at;
var r=await fetch(sbu()+path,{method:o.method||'GET',headers:h,body:o.body});
if(r.status===401&&SBS&&SBS.rt&&!again){await sbRefresh();return sbf(path,o,true)}
var t=await r.text();if(!r.ok){var m;try{var j=JSON.parse(t);m=j.msg||j.message||j.error_description||j.error}catch(e){m=t}throw new Error(m||'HTTP '+r.status)}
return t?JSON.parse(t):null}
function ccol(){return CL.collection('data/users/'+SY.uid)}
async function kvGet(k){if(SY.mode==='claude'){var d=await ccol().doc(k).get();return d.exists?d.data():null}
var r=await sbf('/rest/v1/lifehub_data?select=v,ts&user_id=eq.'+SY.uid+'&k=eq.'+encodeURIComponent(k));return r&&r[0]?r[0]:null}
async function kvSet(k,v,ts){if(SY.mode==='claude'){await ccol().doc(k).set(k==='meta'?JSON.parse(v):{v:v,ts:ts});return}
await sbf('/rest/v1/lifehub_data?on_conflict=user_id,k',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{user_id:SY.uid,k:k,v:v,ts:ts||0}])})}
async function getMeta(){var r=await kvGet('meta');return r?(SY.mode==='claude'?r:JSON.parse(r.v)):null}
function setMeta(o){return kvSet('meta',JSON.stringify(o),o.ts)}
async function syncPush(){if(!SY.db||SY.busy||SY.st==='conflict')return;SY.busy=true;SY.pend=false;
try{var pk=packS(),n=Math.ceil(pk.json.length/80000)||1,ts=SY.ts||Date.now();SY.ts=ts;lsw('lifehub-ts',ts);
for(var i=0;i<n;i++)await kvSet('c'+i,pk.json.slice(i*80000,(i+1)*80000),ts);
for(var k in pk.imgs)if(SY.imgs[k]!==pk.imgs[k]){await kvSet('img_'+k,pk.imgs[k],ts);SY.imgs[k]=pk.imgs[k]}
await setMeta({ts:ts,n:n,dev:SY.dev});SY.rts=ts;SY.st='ok';SY.msg='Synced at '+new Date().toLocaleTimeString();lsw('lifehub-linked',SY.uid)}
catch(e){SY.st='err';SY.msg='Sync failed: '+nice(e)+' Your data is still saved on this device.'}
SY.busy=false;if(SY.pend)syncSoon();syncUi()}
function nice(e){var m=(e&&(e.message||e.code))||'unknown error';return e instanceof TypeError?'could not reach the server (check your connection and project URL).':m}
async function syncPull(force){if(!SY.db||SY.pulling)return false;SY.pulling=true;
try{var m=await getMeta();if(!m||(!force&&m.ts<=SY.ts)){SY.pulling=false;return false}
var js='';for(var i=0;i<m.n;i++){var cs=await kvGet('c'+i);if(!cs||cs.ts!==m.ts)throw new Error('cloud data is mid-update, try again');js+=cs.v}
var c=JSON.parse(js),get=async function(v,set){if(typeof v==='string'&&v.indexOf('@img:')===0){var k=v.slice(5),d=await kvGet('img_'+k);set(d?d.v:'');if(d)SY.imgs[k]=d.v}};
if(c.profile)await get(c.profile.pic,function(u){c.profile.pic=u});
for(var p of c.prog||[])await get(p.img,function(u){p.img=u});
for(var x of c.pics||[])for(var a of['front','side','rear'])await get(x[a],function(u){x[a]=u});
Object.keys(S).forEach(function(k){delete S[k]});Object.assign(S,c);ensure();SY.ts=SY.rts=m.ts;lsw('lifehub-v1',JSON.stringify(S));lsw('lifehub-ts',m.ts);lsw('lifehub-linked',SY.uid);SY.st='ok';SY.msg='Updated from cloud at '+new Date().toLocaleTimeString();SY.pulling=false;render();return true}
catch(e){SY.pulling=false;SY.st='err';SY.msg='Could not load cloud data: '+nice(e);syncUi();return false}}
function syncSoon(){if(!SY.db||SY.st==='conflict')return;clearTimeout(SY.timer);SY.timer=setTimeout(syncPush,1500)}
function typing(){return/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')}
function syncUi(){if(!typing())render()}
async function syncStart(){try{var m=await getMeta(),linked=lsr('lifehub-linked')===SY.uid;
if(m){SY.rts=m.ts;if(!linked&&hasData()&&SY.ts!==m.ts){SY.st='conflict';SY.msg='Cloud data was found, and this device also has data.'}else if(m.ts>SY.ts)await syncPull(true);else if(SY.ts>m.ts)await syncPush();else{SY.st='ok';SY.msg='Synced';lsw('lifehub-linked',SY.uid)}}
else if(hasData()){SY.ts=SY.ts||Date.now();await syncPush()}else{SY.st='ok';SY.msg='Cloud sync is on. Nothing saved yet.';lsw('lifehub-linked',SY.uid)}}
catch(e){SY.st='err';SY.msg='Cloud sync could not start: '+nice(e)}syncUi()}
async function sbBegin(){SY.mode='sb';SY.uid=SBS.uid;SY.db=true;SY.msg='Connecting…';clearInterval(SY.poll);SY.poll=setInterval(poll,30000);await syncStart()}
async function poll(){if(SY.mode!=='sb'||!SY.db||SY.busy||SY.pulling||SY.st==='conflict'||typing())return;try{var m=await getMeta();if(m&&m.dev!==SY.dev&&m.ts>SY.ts)await syncPull(false)}catch(e){}}
async function syncInit(){var cl=window.claude;
if(cl&&cl.use){try{var db=await cl.use('db'),us=await cl.use('user'),id=db&&us?await us.id():null;
if(id){SY.mode='claude';CL=db;SY.uid=id;SY.db=true;SY.msg='Connecting…';await syncStart();db.doc('data/users/'+id+'/meta').onSnapshot(function(s){if(!s.exists)return;var m=s.data();if(m.dev!==SY.dev&&m.ts>SY.ts&&SY.st!=='conflict'&&!SY.busy){if(typing())SY.defer=true;else syncPull(false)}},function(){});return}}catch(e){}
SY.msg='Sign in to Claude to sync between devices. Data is saved on this device.';syncUi();return}
if(SBC.url&&SBC.key&&SBS)await sbBegin();else{SY.msg=SBC.url?'Sign in to sync your data.':'Cloud sync is not set up. Data is saved on this device.';syncUi()}}
function syncBanner(){return SY.st==='conflict'?'<div class="card sec" style="border-color:var(--acc2)"><b>Cloud data found.</b> This device also has its own data. Which should LifeHub keep?<div class="row" style="margin-bottom:0"><button class="add" data-act="syncuse">Use cloud data</button><button class="ghost" data-act="synclocal">Use this device’s data</button></div></div>':''}
function syncCard(){var inC=!!(window.claude&&window.claude.use),s=SY.st==='ok'?'●':SY.st==='err'?'▲':SY.st==='conflict'?'◆':'○',h='<h2>Sync</h2><div class="card"><p style="margin:0 0 8px"><b>'+s+'</b> '+esc(SY.msg||'Not connected.')+'</p>';
if(SY.db)h+='<div class="row" style="margin-top:0"><button class="add" data-act="syncnow">Sync now</button><button class="ghost" data-act="syncuse">Replace this device with cloud data</button><button class="ghost" data-act="synclocal">Replace cloud with this device</button>'+(SY.mode==='sb'?'<button class="ghost" data-act="sbout">Sign out</button>':'')+'</div>';
if(SY.mode==='claude')h+='<p class="sub" style="margin:0">Open LifeHub through Claude on any device signed in to the same account and your data syncs automatically.</p>';
else if(SY.mode==='sb')h+='<p class="sub" style="margin:0">Signed in as '+esc(SBS&&SBS.email)+'. Changes sync within seconds and other devices check every 30 seconds.</p><div class="row"><button class="ghost" data-act="sbreset">Disconnect this Supabase project</button></div>';
else if(inC)h+='<p class="sub" style="margin:0">This copy is running inside Claude, which blocks connections to other servers. To sync outside Claude, host the standalone LifeHub file and connect your own Supabase project there.</p>';
else if(!SBC.url)h+='<h3>Set up your own cloud (free)</h3><ol class="sub" style="margin:0 0 10px;padding-left:20px"><li>Create a free project at supabase.com.</li><li>Open SQL Editor, paste the SQL below and run it.</li><li>Under Authentication → Providers → Email, turn off “Confirm email” for instant sign-up (optional).</li><li>Under Project Settings → API, copy the Project URL and the anon public key into the boxes below. Never use the service_role key.</li></ol><details><summary>Show setup SQL</summary><pre class="sql">'+esc(SQL)+'</pre><button class="ghost" data-act="sbcopy">Copy SQL</button></details><form data-f="sbcfg" style="margin-top:12px"><label>Project URL<input name="url" type="url" placeholder="https://abcd1234.supabase.co" required></label><label>Anon public key<input name="key" type="text" required></label><button class="add" type="submit">Save connection</button></form>';
else h+='<form data-f="sbauth"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="pw" type="password" autocomplete="current-password" minlength="6" required></label><button class="add" type="submit" name="a" value="in">Sign in</button><button class="ghost" type="submit" name="a" value="up">Create account</button></form><div class="row" style="margin-top:0"><button class="ghost" data-act="sbreset">Change connection</button></div>';
return h+'</div><h2>Backup</h2><div class="card"><p class="sub" style="margin:0 0 10px">Save all your data to a file you can keep, or restore from one. This also lets you move between copies of LifeHub.</p><div class="row" style="margin-top:0"><button class="add" data-act="export">Export backup</button><label>Restore from backup<input type="file" id="imp" accept=".json,application/json"></label></div></div>'}
async function doExport(){var j=JSON.stringify(S),nm='lifehub-backup-'+today()+'.json';
try{var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:nm,data:j});return}}catch(e){if(e&&e.code==='declined')return}
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=nm;document.body.appendChild(a);a.click();a.remove()}

document.addEventListener('click',function(e){var b=e.target.closest('[data-act^="sync"],[data-act^="sb"],[data-act="export"]');if(!b)return;e.stopImmediatePropagation();var a=b.getAttribute('data-act');
if(a==='export')doExport();
else if(a==='syncnow'){SY.ts=Date.now();lsw('lifehub-ts',SY.ts);if(SY.st==='err')SY.st='ok';syncPush()}
else if(a==='syncuse'){SY.st='ok';syncPull(true)}
else if(a==='synclocal'){SY.st='ok';SY.ts=Date.now();lsw('lifehub-ts',SY.ts);syncPush()}
else if(a==='sbcopy'){try{navigator.clipboard.writeText(SQL);SY.msg='SQL copied to your clipboard.'}catch(x){SY.msg='Select the SQL text and copy it manually.'}render()}
else if(a==='sbout'){SBS=null;lsw('lifehub-sbs','');clearInterval(SY.poll);SY.db=false;SY.mode='';SY.st='local';SY.msg='Signed out. Data is still saved on this device.';render()}
else if(a==='sbreset'){SBS=null;SBC={url:'',key:''};lsw('lifehub-sbs','');lsw('lifehub-sb','');clearInterval(SY.poll);SY.db=false;SY.mode='';SY.st='local';SY.msg='Disconnected. Data is still saved on this device.';render()}},true);
document.addEventListener('submit',function(e){var f=e.target,k=f.getAttribute('data-f');if(k!=='sbcfg'&&k!=='sbauth')return;e.stopImmediatePropagation();e.preventDefault();
if(k==='sbcfg'){var u=f.elements.url.value.trim();if(!/^https?:\/\//.test(u))u='https://'+u;SBC={url:u.replace(/\/+$/,''),key:f.elements.key.value.trim()};lsw('lifehub-sb',JSON.stringify(SBC));SY.msg='Connection saved. Sign in or create an account.';render();return}
var up=e.submitter&&e.submitter.value==='up',em=f.elements.email.value.trim(),pw=f.elements.pw.value;SY.msg=up?'Creating account…':'Signing in…';render();
fetch(sbu()+(up?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:SBC.key,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
if(!x.ok)throw new Error(x.j.msg||x.j.error_description||x.j.message||x.j.error||'Request failed');
if(!x.j.access_token){SY.msg='Account created. Check your email to confirm it, then sign in.';render();return}
sbSession(x.j);return sbBegin()}).catch(function(x){SY.msg='Sign-in failed: '+nice(x);render()})},true);
document.addEventListener('change',function(e){var t=e.target;if(t.id!=='imp'||!t.files[0])return;var r=new FileReader();
r.onload=function(){try{var c=JSON.parse(r.result);if(!c||typeof c!=='object'||Array.isArray(c))throw new Error('not a LifeHub backup');Object.keys(S).forEach(function(k){delete S[k]});Object.assign(S,c);ensure();if(SY.st==='conflict')SY.st='ok';save();SY.msg='Backup restored';render()}catch(x){SY.msg='Could not restore that file: '+x.message;render()}};r.readAsText(t.files[0])});
document.addEventListener('focusout',function(){if(SY.defer){SY.defer=false;setTimeout(function(){if(!typing())syncPull(false)},50)}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')poll()});
syncInit();
render();
</script>
</body>
